name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: stock_user
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: stock_research
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stock_user -d stock_research"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://stock_user:ci-only-password@127.0.0.1:5432/stock_research
      TEST_DATABASE_URL: postgresql+psycopg://stock_user:ci-only-password@127.0.0.1:5432/stock_research_test
      PROVIDER_NETWORK_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install locked Python environment
        run: uv sync --frozen --all-groups

      - name: Create isolated test database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: >-
          docker exec "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1
          -U stock_user -d postgres
          -c "CREATE DATABASE stock_research_test OWNER stock_user"

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Unit and contract tests
        run: uv run pytest -m "not integration"

      - name: PostgreSQL integration tests
        run: uv run pytest -m integration tests/integration tests/contract/test_security_api_contract.py

      - name: Alembic upgrade, downgrade, and second upgrade
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
